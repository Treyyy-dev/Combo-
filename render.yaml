services:
  - type: web
    name: combo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: combo-db
          property: connectionString
      - key: DEV_KEY
        generateValue: true

databases:
  - name: combo-db
    plan: free
    region: oregon
